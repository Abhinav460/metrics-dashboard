<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Metrics Dashboard</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:           #0f172a;
            --card-bg:      #1e293b;
            --card-border:  rgba(255, 255, 255, 0.07);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:   #64748b;
            --cpu-color:    #3b82f6;
            --mem-color:    #8b5cf6;
            --disk-color:   #10b981;
            --warn-color:   #f59e0b;
            --crit-color:   #ef4444;
            --radius:       16px;
            --radius-sm:    8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 32px 16px;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-group h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 100px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .pulse-dot.online {
            background: #10b981;
            animation: ring 2s ease-in-out infinite;
        }

        .pulse-dot.offline {
            background: var(--text-muted);
        }

        @keyframes ring {
            0%   { box-shadow: 0 0 0 0   rgba(16, 185, 129, 0.5); }
            70%  { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);   }
            100% { box-shadow: 0 0 0 0   rgba(16, 185, 129, 0);   }
        }

        /* ── Grid ── */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        /* ── Cards ── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .card-icon.cpu  { background: rgba(59,  130, 246, 0.15); }
        .card-icon.mem  { background: rgba(139,  92, 246, 0.15); }
        .card-icon.disk { background: rgba(16,  185, 129, 0.15); }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
        }

        /* ── Main percentage ── */
        .main-value {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .main-value.cpu-accent  { color: var(--cpu-color);  }
        .main-value.mem-accent  { color: var(--mem-color);  }
        .main-value.disk-accent { color: var(--disk-color); }
        .main-value.warn        { color: var(--warn-color); }
        .main-value.crit        { color: var(--crit-color); }

        /* ── Progress bar ── */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 100px;
            width: 0%;
            transition: width 0.5s ease, background 0.3s ease;
        }

        .progress-fill.cpu  { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .progress-fill.mem  { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .progress-fill.disk { background: linear-gradient(90deg, #10b981, #34d399); }
        .progress-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .progress-fill.crit {
            background: linear-gradient(90deg, #ef4444, #f87171);
            animation: pulse-bar 1s ease-in-out infinite;
        }

        @keyframes pulse-bar {
            0%, 100% { opacity: 1;   }
            50%       { opacity: 0.6; }
        }

        /* ── Sub-metrics ── */
        .sub-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sub-metric {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }

        .sub-metric.full-width {
            grid-column: span 2;
        }

        .sub-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
        }

        .sub-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ── Footer ── */
        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .footer-item {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-item span {
            color: var(--text-secondary);
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            header       { flex-direction: column; align-items: flex-start; }
            .main-value  { font-size: 2.5rem; }
            .metrics-grid { gap: 16px; }
        }
    </style>
</head>
<body>
<div class="dashboard">

    <header>
        <div class="title-group">
            <h1>System Metrics</h1>
            <p>Real-time hardware monitoring</p>
        </div>
        <div class="live-badge">
            <div class="pulse-dot offline" id="pulse-dot"></div>
            <span id="live-text">Connecting&hellip;</span>
        </div>
    </header>

    <div class="metrics-grid">

        <!-- CPU -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon cpu">&#9889;</div>
                <div class="card-title">CPU</div>
            </div>
            <div class="main-value cpu-accent" id="cpu-percent">--</div>
            <div class="progress-track">
                <div class="progress-fill cpu" id="cpu-bar"></div>
            </div>
            <div class="sub-metrics">
                <div class="sub-metric">
                    <div class="sub-label">Logical Cores</div>
                    <div class="sub-value" id="cpu-cores">--</div>
                </div>
                <div class="sub-metric">
                    <div class="sub-label">Frequency</div>
                    <div class="sub-value" id="cpu-freq">--</div>
                </div>
            </div>
        </div>

        <!-- Memory -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon mem">&#129504;</div>
                <div class="card-title">Memory (RAM)</div>
            </div>
            <div class="main-value mem-accent" id="mem-percent">--</div>
            <div class="progress-track">
                <div class="progress-fill mem" id="mem-bar"></div>
            </div>
            <div class="sub-metrics">
                <div class="sub-metric">
                    <div class="sub-label">Used</div>
                    <div class="sub-value" id="mem-used">--</div>
                </div>
                <div class="sub-metric">
                    <div class="sub-label">Total</div>
                    <div class="sub-value" id="mem-total">--</div>
                </div>
                <div class="sub-metric full-width">
                    <div class="sub-label">Available</div>
                    <div class="sub-value" id="mem-free">--</div>
                </div>
            </div>
        </div>

        <!-- Disk -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon disk">&#128190;</div>
                <div class="card-title">Disk (/)</div>
            </div>
            <div class="main-value disk-accent" id="disk-percent">--</div>
            <div class="progress-track">
                <div class="progress-fill disk" id="disk-bar"></div>
            </div>
            <div class="sub-metrics">
                <div class="sub-metric">
                    <div class="sub-label">Used</div>
                    <div class="sub-value" id="disk-used">--</div>
                </div>
                <div class="sub-metric">
                    <div class="sub-label">Total</div>
                    <div class="sub-value" id="disk-total">--</div>
                </div>
                <div class="sub-metric full-width">
                    <div class="sub-label">Free</div>
                    <div class="sub-value" id="disk-free">--</div>
                </div>
            </div>
        </div>

    </div><!-- /.metrics-grid -->

    <footer>
        <div class="footer-item">Last updated: <span id="last-updated">--</span></div>
        <div class="footer-item">Next refresh in: <span id="refresh-countdown">--</span></div>
    </footer>

</div><!-- /.dashboard -->

<script>
    const INTERVAL_MS = 2000;
    let countdownTimer = null;

    function startCountdown() {
        clearInterval(countdownTimer);
        let remaining = Math.round(INTERVAL_MS / 1000);
        const el = document.getElementById('refresh-countdown');
        el.textContent = remaining + 's';
        countdownTimer = setInterval(() => {
            remaining = Math.max(0, remaining - 1);
            el.textContent = remaining + 's';
        }, 1000);
    }

    // Returns the correct CSS class for a given usage percent and metric type.
    function barClass(percent, type) {
        if (percent >= 90) return 'crit';
        if (percent >= 70) return 'warn';
        return type;   // 'cpu' | 'mem' | 'disk'
    }

    function valueClass(percent, accentClass) {
        if (percent >= 90) return 'crit';
        if (percent >= 70) return 'warn';
        return accentClass;
    }

    function setBar(id, percent, type) {
        const el = document.getElementById(id);
        el.style.width = percent + '%';
        el.className = 'progress-fill ' + barClass(percent, type);
    }

    function setValue(id, percent, accentClass, text) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'main-value ' + valueClass(percent, accentClass);
    }

    async function updateMetrics() {
        startCountdown();
        try {
            const res  = await fetch('/api/metrics');
            const data = await res.json();

            // CPU
            const cpuPct = data.cpu.percent;
            setValue('cpu-percent', cpuPct, 'cpu-accent', cpuPct.toFixed(1) + '%');
            setBar('cpu-bar', cpuPct, 'cpu');
            document.getElementById('cpu-cores').textContent = data.cpu.count;
            document.getElementById('cpu-freq').textContent =
                data.cpu.frequency != null
                    ? data.cpu.frequency.toLocaleString() + ' MHz'
                    : 'N/A';

            // Memory
            const memPct = data.memory.percent;
            setValue('mem-percent', memPct, 'mem-accent', memPct.toFixed(1) + '%');
            setBar('mem-bar', memPct, 'mem');
            document.getElementById('mem-used').textContent  = data.memory.used_gb  + ' GB';
            document.getElementById('mem-total').textContent = data.memory.total_gb + ' GB';
            document.getElementById('mem-free').textContent  = data.memory.free_gb  + ' GB';

            // Disk
            const diskPct = data.disk.percent;
            setValue('disk-percent', diskPct, 'disk-accent', diskPct.toFixed(1) + '%');
            setBar('disk-bar', diskPct, 'disk');
            document.getElementById('disk-used').textContent  = data.disk.used_gb  + ' GB';
            document.getElementById('disk-total').textContent = data.disk.total_gb + ' GB';
            document.getElementById('disk-free').textContent  = data.disk.free_gb  + ' GB';

            // Status
            document.getElementById('pulse-dot').className = 'pulse-dot online';
            document.getElementById('live-text').textContent = 'Live';

            // Timestamp
            document.getElementById('last-updated').textContent =
                new Date().toLocaleTimeString();

        } catch (err) {
            console.error('Metrics fetch failed:', err);
            document.getElementById('pulse-dot').className = 'pulse-dot offline';
            document.getElementById('live-text').textContent = 'Offline';
        }
    }

    updateMetrics();
    setInterval(updateMetrics, INTERVAL_MS);
</script>
</body>
</html>
